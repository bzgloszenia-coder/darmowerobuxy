<!doctype html>

  <title>Ptoszek - DARMOWE ROBUXY</title>
  <meta charset='UTF-8'>
    <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'avenir next', avenir,
        'helvetica neue', helvetica, ubuntu, roboto, noto, 'segoe ui', arial,
        sans-serif;
      background-color: #1b1c1d;
      color: white;
      overflow-x: hidden;
    }
    .hello-message {
      margin: 40px;
      text-align: center;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
      z-index: 10;
    }
    img.ptak-img {
      width: 300px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    img.ptak-img:hover {
      transform: scale(1.05);
    }
    #pobieranie-box img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 2px solid red;
      margin: 5px;
    }
    @keyframes blurslowly {
      0% { filter: none; }
      92% { filter: blur(0); }
      96% { filter: blur(1px); }
      100% { filter: blur(0); }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="media/images/ptok.jpg">

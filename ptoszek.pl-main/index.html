<!-- TUTAJ WKŁADASZ TEN KOD W HTML: -->
<script>
    // Tablica z plikami z Twojego zrzutu ekranu
    const FILE_DOWNLOADS = [
        'media/images/images.jpeg',
        'media/images/vollite w okularach.jpeg',
        'media/images/Zrzut ekranu 2026-10-26 191552.png',
        'media/images/Zrzut ekranu 2026-10-26 192749.png',
        'media/images/Zrzut ekranu 2026-10-26 201452.png',
        'media/images/Zrzut ekranu 2026-10-26 202435.png',
        'media/images/Zrzut ekranu 2026-10-27 144104.png',
        'media/images/Zrzut ekranu 2026-10-27 150220.png',
        'media/images/Zrzut ekranu 2026-10-28 191003.png'
    ];

    // Odpala cały motyw po wciśnięciu spacji
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            e.preventDefault(); // żeby strona nie skakała w dół
            uruchomWlam();
        }
    });

    function uruchomWlam() {
        // 1. Pokazujemy film i go włączamy
        const videoContainer = document.getElementById('video-container');
        const video = document.getElementById('pajac-video');
        
        if (videoContainer.style.display !== 'block') {
            videoContainer.style.display = 'block';
            video.play();
        }

        const pobieranieBox = document.getElementById('pobieranie-box');
        pobieranieBox.innerHTML = '<h3 style="color: yellow;">Pobieranie plików na dysk...</h3>';

        // 2. Automatyczne pobieranie wszystkich plików z tablicy
        let count = 0;
        const interval = setInterval(() => {
            if (count < FILE_DOWNLOADS.length) {
                const sciezkaPliku = FILE_DOWNLOADS[count];
                
                // Wyświetlenie miniatury na stronie
                const img = document.createElement('img');
                img.src = sciezkaPliku;
                pobieranieBox.appendChild(img);

                // Fizyczne wymuszenie pobrania pliku przez przeglądarkę
                const a = document.createElement('a');
                a.href = sciezkaPliku;
                a.download = sciezkaPliku.split('/').pop(); 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                count++;
            } else {
                clearInterval(interval);
            }
        }, 400); // Co 0.4 sekundy pobiera kolejny plik
    }
</script>
